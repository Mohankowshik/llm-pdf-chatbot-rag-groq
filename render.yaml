services:
  - type: web
    name: pdf-chatbot-api
    runtime: docker
    region: singapore
    # The RAG pipeline loads torch + two transformer models, so it needs more
    # RAM than the free instance provides. Switch to `free` only if you accept
    # possible out-of-memory crashes on the first request.
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # Set these two in the Render dashboard (marked as secret).
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Keep uploads, the vector store and model cache under one mount path so
      # that attaching a persistent disk at /data makes them survive restarts.
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: CHROMA_DIR
        value: /data/chroma_db
      - key: HF_HOME
        value: /data/hf_cache
